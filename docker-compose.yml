services:
  app:
    build: .
    ports:
      - "8081:80"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: dapurkita
      DB_USERNAME: dapurkita
      DB_PASSWORD: dapurkita_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    command: sh -c "php artisan key:generate --force && php artisan migrate --seed --force && apache2-foreground"
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:80
    depends_on:
      - app
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dapurkita
      POSTGRES_USER: dapurkita
      POSTGRES_PASSWORD: dapurkita_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dapurkita -d dapurkita"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
